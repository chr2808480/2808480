<!doctype html>
<!-- このファイルは posts-data.js から自動で作られています。直接編集しても、次の更新で上書きされます。
     記事の中身は posts-data.js、ページの形は .claude/skills/blog-rewrite/templates/post.html を直してください。 -->
<html lang="ja">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>{{title}}｜えとくらし</title>
 <meta name="description" content="{{description}}">
 <!-- 検索エンジンに「この記事の正式なURLはここです」と伝える目印（?from=... 付きのURLも同じ記事として扱われます） -->
 <link rel="canonical" href="{{url}}">
 <!-- SNSでシェアされたときの表示（OGP） -->
 <meta property="og:site_name" content="えとくらし">
 <meta property="og:type" content="article">
 <meta property="og:title" content="{{title}}">
 <meta property="og:description" content="{{description}}">
 <meta property="og:url" content="{{url}}">
 <meta property="og:image" content="https://chr2808480.github.io/2808480/images/index/icon.jpg">
 <meta name="twitter:card" content="summary">
 <!-- 検索エンジン向けの記事情報（タイトル・公開日・書いた人） -->
 <script type="application/ld+json">{{json_ld}}</script>
 <link href="../reset.css" rel="stylesheet">
 <link href="../common.css" rel="stylesheet" type="text/css">
 <link href="../each.css" rel="stylesheet" type="text/css">
  <!-- ファビコン（ブラウザのタブやブックマークに表示されるアイコン） -->
 <link rel="icon" href="../images/index/icon.jpg" type="image/jpeg">
 <link rel="apple-touch-icon" href="../images/index/icon.jpg">
</head>

<body oncontextmenu="return false;">

 <!--  ヘッダー -->
 <header class="header divider">
  <!-- ハンバーガーメニュー -->
  <button id="js-hamburger" class="hamburger"><span class="hamburger__line"></span></button>

  <!-- メニュー -->
  <nav id="js-globalnav" class="globalnav flex">
   <ul class="globalnav__main">
    <li class="globalnav__item"><a href="../index.html">Top</a></li>
    <li class="globalnav__item"><a href="../gallery.html">Gallery</a></li>
    <li class="globalnav__item"><a href="../blog.html">Blog</a></li>
    <li class="globalnav__item"><a href="../request.html">Request</a></li>
   </ul>
  </nav><!-- メニューここまで -->
 </header>
<!-- メインコンテンツ -->
 <main class="mainwrapper" id="js-main">
    <a href="../blog.html" class="back-link">← 一覧に戻る</a>
  <article class="onelogbox">
    <div class="oneloginfo">
      <span class="postdata"><time datetime="{{date}}">{{date}}</time></span>
      <span class="categories">{{category}}</span>
    </div>
    <div class="comment">
      <h1 class="article-title">{{title}}</h1>
      {{pr_notice}}
      <div class="body-text">{{content}}</div>
    </div>
  </article>
<a href="../blog.html" class="back-link">← 一覧に戻る</a>
<div class="spacer"></div><div class="spacer"></div><div class="spacer"></div>
 </main>

<script>
  // 「一覧に戻る」リンクに、一覧で選んでいたカテゴリー（?from=...）を引き継ぐ
  const from = new URLSearchParams(location.search).get('from');

  if (from) {
    document.querySelectorAll('.back-link').forEach(link => {
      link.href = `../blog.html?category=${encodeURIComponent(from)}`;
    });
  }
</script>

<!-- ページUP -->
 <a href="#" class="pageup" id="js-pageup">
  <div class="arrow"></div>
 </a><!-- ページUPここまで -->

 <!-- フッター -->
 <footer class="divider">
  <!-- フッターリンク -->
  <ul class="footer-links">
   <li><a href="../privacy.html">プライバシーポリシー・免責事項</a></li>
   <li><a href="../index.html#contact">お問い合わせ</a></li>
  </ul>
  <!-- クレジット -->
  <small>© 2026 Illust and Life.<br>Designed by <a href="https://hiro-design.net/utsusemi/" target="_blank">Utsusemi
    Design</a>.</small>
  <!-- クレジットここまで -->
 </footer>

<script src="../common.js"></script>
</body>
</html>
