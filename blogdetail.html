<script src="posts-data.js"></script>
<script>
  // URL の ?id=... を読み取り、該当記事を POSTS から探して表示する
  // 広告・アフィリエイトリンクを含む記事は、posts-data.js の記事に pr: true を付けてください。
  // 記事の冒頭に「この記事にはプロモーション（広告）が含まれています。」と表示されます（ステマ規制への対応）。
  //   例）{ id: 46, title: "…", date: "2026-10-01", category: "趣味", pr: true, content: "…" },
  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get('id'));
  const post = POSTS.find(p => p.id === id);
  const container = document.getElementById('article');

  if (post) {
    // 検索結果に出るタイトル・説明文を、この記事のものに書き換える
    document.title = `${post.title}｜えとくらし`;
    document.querySelector('meta[name="description"]').content =
      post.content.replace(/<[^>]*>/g, '').trim().slice(0, 100);

    // ?from=... が付いたURLも同じ記事として扱ってもらうための目印（canonical）
    const canonical = document.createElement('link');
    canonical.rel = 'canonical';
    canonical.href = new URL(`blogdetail.html?id=${post.id}`, location.href).href;
    document.head.appendChild(canonical);

    container.innerHTML = `
      <div class="onelogbox">
        <div class="oneloginfo">
          <span class="postdata"><time>${post.date}</time></span>
          <span class="categories">${post.category ?? ''}</span>
        </div>
        <div class="comment">
          <h2 class="article-title">${post.title}</h2>
          ${post.pr ? '<p class="pr-notice">この記事にはプロモーション（広告）が含まれています。</p>' : ''}
          <div class="body-text">${post.content}</div>
        </div>
      </div>
    `;
  } else {
    container.innerHTML = `<p class="not-found">記事が見つかりませんでした。</p>`;

    // 存在しない記事のページは検索結果に出さない
    const noindex = document.createElement('meta');
    noindex.name = 'robots';
    noindex.content = 'noindex';
    document.head.appendChild(noindex);
  }

  // 「一覧に戻る」リンクに、一覧で選んでいたカテゴリー（?from=...）を引き継ぐ
  const from = params.get('from');

  if (from && POSTS.some(p => p.category === from)) {
    document.querySelectorAll('.back-link').forEach(link => {
      link.href = `blog.html?category=${encodeURIComponent(from)}`;
    });
  }
</script>
