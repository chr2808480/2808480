 <title>Blog｜えとくらし</title>
 <script>
  // 記事ページは posts/<id>.html に引っ越しました。
  // 以前のURL（blogdetail.html?id=...）で来た人や検索エンジンを、新しい記事ページへ案内します。
  // 一覧で選んでいたカテゴリー（?from=...）もそのまま引き継ぎます。
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (/^\d+$/.test(id ?? '')) {
    const from = params.get('from');
    location.replace(`posts/${Number(id)}.html${from ? `?from=${encodeURIComponent(from)}` : ''}`);
  } else {
    // 記事の番号がなく、このページが表示されたままのときは検索結果に出さない
    // （HTMLに直接書くと、検索エンジンが上の引っ越し案内を読まずに帰ってしまうため、ここで付けています）
    const noindex = document.createElement('meta');
    noindex.name = 'robots';
    noindex.content = 'noindex';
    document.head.appendChild(noindex);
  }
 </script>
